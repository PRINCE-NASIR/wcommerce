<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WooCommerce POS Dashboard</title>
    <script>
      // Robust global shim to prevent "Cannot set property fetch of #<Window>" errors
      // commonly caused by fetch polyfills in sandboxed environments (like iframes or WebViews).
      (function() {
        // 1. Fix 'global'
        if (typeof global === 'undefined') {
          window.global = window;
        }

        // 2. Fix 'fetch' attempt to overwrite
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _fetch; },
            set: function(v) { 
              console.warn('Blocked attempt to overwrite fetch');
              _fetch = v; 
            }
          });
        } catch (e) {
          console.warn('Could not redefine fetch property, falling back to proxy if needed');
        }

        // 3. Fallback proxy for other global properties
        if (typeof window.global === 'undefined' || window.global === window) {
          try {
            var proxy = new Proxy(window, {
              set: function(target, prop, value) {
                try {
                  target[prop] = value;
                } catch (e) {
                  console.warn('Caught attempt to overwrite read-only property:', prop);
                }
                return true;
              }
            });
            // We can't easily replace window, but we can make global a proxy
            window.global = proxy;
          } catch (e) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
